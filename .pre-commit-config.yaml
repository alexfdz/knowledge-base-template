repos:
  - repo: local
    hooks:
      - id: kb-check
        name: KB integrity (duplicate IDs, dangling references)
        entry: python3 scripts/kb_check.py
        language: system
        pass_filenames: false
        files: '\.md$'
      - id: no-local-files
        name: Private *.local.md files stay untracked
        entry: "*.local.md holds credentials; never commit it (keep it gitignored)"
        language: fail
        files: '\.local\.md$'
